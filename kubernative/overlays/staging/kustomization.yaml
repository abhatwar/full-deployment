apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base Kubernetes resources
resources:

  - ../../base/deployment.yaml
  - ../../base/service.yaml
  - ../../base/ingress.yaml
  - ../../base/configmap.yaml
  - ../../base/hpa.yaml


# Environment-specific changes
patches:

  - path: deployment-patch.yaml


# Staging configuration
configMapGenerator:

  - name: sumo-backend-config

    behavior: replace

    literals:

      - NODE_ENV=staging
      - PORT=7050
      - AWS_REGION=ap-south-1
      - S3_BUCKET=sumo-staging-bucket