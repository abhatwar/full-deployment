apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:

  - ../../base/deployment.yaml
  - ../../base/service.yaml
  - ../../base/ingress.yaml
  - ../../base/configmap.yaml
  - ../../base/hpa.yaml


patches:

  - path: deployment-patch.yaml


# Production configuration
configMapGenerator:

  - name: nearby-backend-config

    behavior: replace

    literals:

      - NODE_ENV=production
      - PORT=7050
      - AWS_REGION=ap-south-1
      - S3_BUCKET=nearby-production-assets