apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: nearby-backend-hpa

spec:

  # Deployment that HPA controls
  scaleTargetRef:

    apiVersion: apps/v1
    kind: Deployment
    name: nearby-backend

  # Minimum Pods
  minReplicas: 2

  # Maximum Pods
  maxReplicas: 5

  metrics:

    - type: Resource

      resource:

        name: cpu

        target:

          type: Utilization

          # Scale when average CPU goes above 70%
          averageUtilization: 70