apiVersion: apps/v1
kind: Deployment

metadata:
  name: nearby-backend

spec:

  # Default number of Pods
  replicas: 2

  selector:
    matchLabels:
      app: nearby-backend

  template:

    metadata:
      labels:
        app: nearby-backend

    spec:

      containers:

        - name: nearby-backend

          # Jenkins/Kustomize will replace this image
          image: NEARBY_ECR_IMAGE

          ports:
            - containerPort: 7050

          # Grant S3 access with EKS Pod Identity or IRSA; do not add AWS keys to this manifest.
          # Environment variables
          envFrom:
            - configMapRef:
                name: nearby-backend-config

          # CPU and memory configuration
          resources:

            requests:
              cpu: "250m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          # Check whether application is alive
          livenessProbe:

            httpGet:
              path: /health
              port: 7050

            initialDelaySeconds: 20
            periodSeconds: 10

          # Check whether application is ready
          readinessProbe:

            httpGet:
              path: /health
              port: 7050

            initialDelaySeconds: 10
            periodSeconds: 5